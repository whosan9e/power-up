<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Train9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="t9p-icon-180.png">
<link rel="icon" href="t9p-icon-192.png">
<title>Train9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b1a;--panel:#14163a;--panel2:#191c48;--ink:#eef0ff;--ink2:#a9aedb;--line:#2b2f63;--soft:#1d2152;
  --a:#ff8a3d;--a2:#ffb547;--p:#8b5cf6;--p2:#c084fc;--b:#3ee6c1;--ok:#4ade80;--warn:#fbbf24;--bad:#fb7185;--on:#16081f;
  --r:14px;--fd:"Barlow Condensed",system-ui,sans-serif;--fb:"Barlow",system-ui,sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 var(--fb);-webkit-text-size-adjust:100%;
  background:radial-gradient(120% 60% at 50% -10%,#3b1f7a 0%,rgba(59,31,122,0) 60%),radial-gradient(80% 50% at 100% 30%,rgba(255,138,61,.10),transparent 60%),var(--bg);background-attachment:fixed}
.wrap{max-width:760px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--fd);letter-spacing:.02em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;text-transform:uppercase}
h2{font-size:21px;font-weight:800;margin:24px 0 10px;text-transform:uppercase;font-style:italic;letter-spacing:.05em;color:var(--ink2)}
h3{font-size:20px;font-weight:700}
p{margin:6px 0}
.muted{color:var(--ink2)}.small{font-size:14px}.center{text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.brand{font:800 italic 22px var(--fd);letter-spacing:.06em;text-transform:uppercase;background:linear-gradient(90deg,var(--a2),var(--a),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.topr{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:700 12px var(--fb);background:var(--soft);color:var(--ink2);border:1px solid var(--line)}
.chip.A{background:var(--a);color:var(--on);border-color:var(--a)}.chip.B{background:var(--b);color:var(--on);border-color:var(--b)}.chip.C{background:var(--p);color:#fff;border-color:var(--p)}
#wkchip{white-space:nowrap;cursor:pointer;padding:2px 10px 2px 4px;min-height:34px;font:800 13px var(--fd);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.gear{min-height:38px;min-width:38px;padding:0;border-radius:50%;display:grid;place-items:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,15,40,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:none;border:0;border-radius:0;color:var(--ink2);font:800 12px var(--fd);letter-spacing:.08em;text-transform:uppercase;padding:10px 2px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected=true]{color:var(--a2);box-shadow:inset 0 2px 0 var(--a)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
button,.btn{font:600 15px var(--fb);border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:10px 14px;min-height:44px;cursor:pointer;transition:transform .12s var(--ease),background .2s}
button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.acc,.btn.acc{background:linear-gradient(180deg,var(--a2),var(--a));color:var(--on);border-color:var(--a);font-weight:700}
button.big{font:800 18px var(--fd);letter-spacing:.08em;text-transform:uppercase;padding:12px 20px}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
label{display:block;font:600 13px var(--fb);color:var(--ink2);margin-bottom:4px}
input,select,textarea{width:100%;font:16px var(--fb);color:var(--ink);background:#0d0f2a;border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px}
textarea{min-height:70px;resize:vertical}
.seg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:40px;background:var(--soft)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.style{text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);min-height:84px}
.style b{display:block;font:800 19px var(--fd);text-transform:uppercase;letter-spacing:.03em}
.style span{font-size:13px;color:var(--ink2);line-height:1.3;display:block}
.style[aria-pressed=true]{border-color:var(--a);box-shadow:0 0 0 1px var(--a),0 0 24px rgba(255,138,61,.25)}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-child{border-top:0}
.exh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.exh b{font-weight:600}
.rx{font:700 14px var(--fb);color:var(--a2);white-space:nowrap}
.tag{font:700 11px var(--fb);text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--ink2);margin-left:6px}
.tag.cardio{background:var(--p);color:#fff}
.bar{height:10px;border-radius:6px;background:#0d0f2a;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--ink2);border-radius:6px}
.bar i.ok{background:var(--ok)}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.band{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink2);border-right:2px solid var(--ink2);opacity:.35}
.macro{display:grid;grid-template-columns:70px 1fr 92px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.macro .v{text-align:right;font-variant-numeric:tabular-nums}
.flag{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin:6px 0;font-size:15px}
.flag::before{content:"";flex:0 0 6px;border-radius:4px;background:var(--ink2)}
.flag.bad::before{background:var(--bad)}.flag.warn::before{background:var(--warn)}.flag.ok::before{background:var(--ok)}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 1fr 36px;gap:6px;align-items:center;margin:4px 0}
.setrow input{min-height:38px;padding:6px 8px;text-align:center}
.setrow .x{min-height:38px;padding:0}
.food{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.food:first-child{border-top:0}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap;font-size:15px}
.msg.u{align-self:flex-end;background:var(--p);color:#fff}
.msg.c{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.stat{background:#0d0f2a;border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font:800 24px var(--fd);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2)}
details summary{cursor:pointer;font-weight:600;min-height:32px}
.ev{border-top:1px solid var(--line);padding:10px 0}
.g{font:700 11px var(--fb);padding:2px 7px;border-radius:6px;text-transform:uppercase}
.g.g1{background:var(--ok);color:var(--on)}.g.g2{background:var(--warn);color:var(--on)}.g.g3{background:var(--soft);color:var(--ink2)}
.hide{display:none!important}
.thumb{max-width:100%;max-height:220px;border-radius:10px;display:block;margin:8px auto}
.spark{width:100%;height:46px;color:var(--a2)}
.note{font-size:13px;color:var(--ink2);margin-top:8px}
/* figures */
.exw{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:start}
.figbox{width:92px;height:86px;padding:0;border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at 50% 30%,#232870,#11133a);min-height:0;display:block;overflow:hidden}
.fig{width:100%;height:100%;display:block;color:var(--ink)}
.fig line{stroke:currentColor;stroke-width:5;stroke-linecap:round}
.fig .far{opacity:.35}
.fig .hl{stroke:var(--a)}
.fig .hd{fill:currentColor}
.fig .fl{stroke:var(--line);stroke-width:1.5}
.fig .pr rect,.fig .pr polygon,.fig .pr circle{fill:var(--ink2);opacity:.5}
.fig .pr .bar{stroke:var(--ink2);stroke-width:2.5}
.fig .post{stroke:var(--line);stroke-width:2}
.fig .cb{stroke:var(--ink2);stroke-width:1}
.fig .ft{stroke-width:4}
.fig .body{filter:drop-shadow(0 1.5px 1.4px rgba(0,0,0,.5))}
.fig .far{opacity:1}
.fig .defn{fill:none;stroke:rgba(60,40,110,.28);stroke-width:.6;stroke-linecap:round}
.fig .bd{stroke:none}
.mini{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px;scroll-snap-type:x mandatory}
.minic{flex:0 0 96px;scroll-snap-align:start;font-size:12px;line-height:1.25;color:var(--ink2)}
.minic span{display:block;margin-top:4px}
dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--panel);color:var(--ink);width:min(92vw,520px);max-height:90vh}
dialog::backdrop{background:rgba(5,4,20,.75)}
.dbody,.rbody{padding:16px}
.bigfig{width:100%;aspect-ratio:120/114;background:radial-gradient(circle at 50% 30%,#232870,#11133a);border-radius:12px;margin-bottom:10px}
.dclose{position:sticky;top:0;float:right;margin:8px}
@media (max-width:420px){.exw{grid-template-columns:78px 1fr}.figbox{width:78px;height:74px}}
/* rank UI */
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:16px;border-radius:18px;border:1px solid var(--line);
  background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(20,22,58,.9) 55%),var(--panel)}
.hero.small{grid-template-columns:auto 1fr}
.heroB{display:grid;place-items:center}
.kicker{font:800 12px var(--fd);letter-spacing:.16em;text-transform:uppercase;color:var(--a2)}
.rk{font-size:34px;font-style:italic;letter-spacing:.04em;margin:2px 0 8px}
.rpbar,.xpbar{height:12px;border-radius:7px;background:#0b0c24;border:1px solid var(--line);overflow:hidden}
.rpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2));box-shadow:0 0 12px var(--a);transition:width .6s var(--ease)}
.xpbar{height:7px;margin-top:10px}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2))}
.rprow{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:4px;font-variant-numeric:tabular-nums}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.hstats div{background:rgba(10,11,30,.6);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.hstats b{display:block;font:800 18px var(--fd);text-transform:uppercase}
.hstats span{font-size:11px;color:var(--ink2)}
@media (max-width:420px){.hero{grid-template-columns:1fr;text-align:center}.hero .rprow{text-align:left}.rk{font-size:30px}}
.banner{margin:10px 0;padding:10px 12px;border-radius:12px;background:linear-gradient(90deg,rgba(255,138,61,.2),rgba(139,92,246,.2));border:1px solid var(--a);font-size:14px}
.mission{border-color:rgba(255,138,61,.5);box-shadow:0 0 30px rgba(255,138,61,.08)}
.quest{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 2px;min-height:48px}
.quest:last-of-type{border-bottom:0}
.qc{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--on)}
.quest.done .qc{background:var(--ok);border-color:var(--ok)}
.quest.done .qt{color:var(--ink2);text-decoration:line-through}
.qx{font:800 13px var(--fd);letter-spacing:.06em;color:var(--a2);white-space:nowrap}
.feed{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.feed:last-child{border-bottom:0}
.fd{color:var(--ink2);font-variant-numeric:tabular-nums}
.fr{font:800 16px var(--fd);font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.up{color:var(--a2)}.dn{color:var(--bad)}
.lb{display:grid;grid-template-columns:24px 34px 1fr auto auto;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);border-radius:8px}
.lb.you{background:rgba(255,138,61,.12);border:1px solid rgba(255,138,61,.5)}
.lbp{font:800 18px var(--fd);color:var(--ink2);text-align:center}
.lbn{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.lbn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbs{font:800 18px var(--fd);font-variant-numeric:tabular-nums}
.lb .x{min-height:32px;min-width:32px;padding:0}
.rung{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;padding:8px;border-radius:10px;opacity:.7}
.rung.cur{opacity:1;background:rgba(139,92,246,.18);border:1px solid var(--p)}
.rung.past{opacity:.9}
.rung b{font:800 18px var(--fd);text-transform:uppercase;letter-spacing:.05em}
.rr{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.rr:last-of-type{border-bottom:0}
.rankmod{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.resb{display:grid;place-items:center;margin:8px 0}
.bigrp{font:800 italic 44px var(--fd);letter-spacing:.02em}
.badge{display:block;overflow:visible}
.float{animation:float 4s ease-in-out infinite}
.pop{animation:pop .7s var(--ease) both}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}

/* ===== Train9 friendly glass theme ===== */
:root{--bg:#0c0a1d;--panel:rgba(255,255,255,.065);--panel2:rgba(255,255,255,.085);--ink:#f5f3ff;--ink2:#bdb6de;--line:rgba(255,255,255,.13);--soft:rgba(255,255,255,.08);
  --a:#a855f7;--a2:#e9b8ff;--pk:#f472b6;--p:#8b5cf6;--p2:#c4b5fd;--on:#ffffff;--r:24px}
body{background:radial-gradient(circle at 12% 8%,rgba(168,85,247,.42),transparent 42%),radial-gradient(circle at 92% 28%,rgba(244,114,182,.22),transparent 40%),radial-gradient(circle at 25% 92%,rgba(56,189,248,.18),transparent 45%),#0c0a1d;background-attachment:fixed}
.card,.hero,details.card{background:var(--panel);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 12px 32px rgba(5,2,20,.35);padding:16px}
.hero{background:linear-gradient(140deg,rgba(168,85,247,.32),rgba(255,255,255,.05) 60%)}
h2{font-style:normal;text-transform:none;letter-spacing:.01em;color:var(--ink);font-size:22px}
h3{font-size:21px}
.brandw{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;box-shadow:0 0 18px rgba(168,85,247,.6)}
.brand{font:800 22px var(--fd);letter-spacing:.04em;text-transform:none;font-style:normal;background:linear-gradient(90deg,#fff,var(--a2) 60%,var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.hello{font-size:17px;color:var(--ink2);margin:2px 4px 10px}
.kicker{color:var(--a2);letter-spacing:.12em}
.rk{font-style:normal;font-size:30px}
button,.btn{border-radius:16px;background:var(--soft);border-color:var(--line)}
button.soft{background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);min-height:40px;padding:8px 14px;border-radius:999px}
button.acc,.btn.acc{background:linear-gradient(135deg,#c084fc,#a855f7 45%,#ec4899);color:#fff;border:0;box-shadow:0 8px 24px rgba(168,85,247,.45)}
button.pri{background:#fff;color:#1a1033;border-color:#fff}
button.big{border-radius:18px;text-transform:none;letter-spacing:.03em;font-size:20px}
.wide{width:100%;margin-top:12px}
input,select,textarea{background:rgba(0,0,0,.25);border-color:var(--line);border-radius:12px}
.chip{background:rgba(255,255,255,.1);border-color:var(--line)}
.chip.A{background:linear-gradient(135deg,#c084fc,#a855f7);color:#fff;border:0}.chip.B{background:linear-gradient(135deg,#5eead4,#14b8a6);color:#04211d;border:0}.chip.C{background:linear-gradient(135deg,#f9a8d4,#ec4899);color:#fff;border:0}
#wkchip{background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.gear{background:rgba(255,255,255,.08)}
nav.tabs{background:rgba(18,12,40,.6);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border-top:1px solid var(--line);margin:0 10px calc(10px + env(safe-area-inset-bottom));border:1px solid var(--line);border-radius:24px;padding-bottom:0;left:0;right:0;bottom:0}
nav.tabs button{text-transform:none;letter-spacing:.02em;font:700 12px var(--fb);border-radius:20px;margin:6px 2px;min-height:50px}
nav.tabs button[aria-selected=true]{color:#fff;box-shadow:none;background:linear-gradient(135deg,rgba(192,132,252,.45),rgba(236,72,153,.35))}
.rpbar,.xpbar{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:999px}
.rpbar i{background:linear-gradient(90deg,#a855f7,#ec4899,#fbbf24);box-shadow:0 0 14px rgba(236,72,153,.7);border-radius:999px;transition:width 1.6s cubic-bezier(.23,1,.32,1)}
.xpbar i{background:linear-gradient(90deg,#60a5fa,#c4b5fd);border-radius:999px;transition:width 1.6s cubic-bezier(.23,1,.32,1) .3s}
.rpbar.big{height:18px}.xpbar.big{height:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line);font:600 13px var(--fb)}
.banner{border-radius:18px;background:rgba(236,72,153,.14);border:1px solid rgba(236,72,153,.4)}
.mission{border-color:rgba(192,132,252,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 40px rgba(168,85,247,.18)}
.quest{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;margin:8px 0;padding:10px 12px}
.quest:last-of-type{border-bottom:1px solid var(--line)}
.quest.done{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.35)}
.qc{border-radius:50%}
.qx{color:var(--a2);font:700 13px var(--fb)}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.ring{aspect-ratio:1;max-width:150px;margin:0 auto;width:100%;border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,#1a1236 76%,transparent 77% 100%),conic-gradient(#a855f7 calc(var(--v)*1%),rgba(255,255,255,.1) 0)}
.ring.p{background:radial-gradient(closest-side,#1a1236 76%,transparent 77% 100%),conic-gradient(#ec4899 calc(var(--v)*1%),rgba(255,255,255,.1) 0)}
.ring b{font:800 24px var(--fd)}.ring span{font-size:12px;color:var(--ink2);padding:0 14px}
details.more summary{font-weight:700}

/* celebration: ranked ring */
.cele{position:fixed;inset:0;z-index:200;display:grid;place-items:center;align-content:center;gap:10px;overflow:hidden;cursor:pointer;--rc:#a855f7;--rc2:#e9d5ff;
  background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--rc) 55%,transparent),rgba(8,8,20,.95) 62%);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  opacity:0;transform:scale(1.05);transition:opacity .45s ease-out,transform .6s cubic-bezier(.23,1,.32,1),background .5s}
.cele.in{opacity:1;transform:none}
.cele.out{opacity:0;transform:translateY(-105%);transition:transform .65s cubic-bezier(.7,0,.84,0),opacity .65s ease-in}
.cele canvas{position:absolute;inset:0;pointer-events:none;z-index:3}
.cele .rays{position:absolute;left:50%;top:44%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;pointer-events:none;opacity:.4;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc2) 60%,transparent) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 58%);mask:radial-gradient(circle,#000 0,transparent 58%);animation:spin 16s linear infinite;transition:opacity .4s}
.cele.loss .rays{opacity:.1}
.cele .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 44%,#fff,color-mix(in srgb,var(--rc2) 70%,transparent) 30%,transparent 60%);opacity:0;pointer-events:none;z-index:2}
.cele.boom .flash{animation:flash .9s ease-out}
.cele.boom .rays{animation:spin 16s linear infinite,raypulse .9s ease-out}
.cring{position:relative;width:min(74vw,300px);aspect-ratio:1;display:grid;place-items:center;z-index:1}
.ringsvg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 14px var(--rc))}
.ringsvg .trk{fill:rgba(10,8,25,.55);stroke:rgba(255,255,255,.12);stroke-width:16}
.ringsvg .arc{fill:none;stroke:var(--rc2);stroke-width:16;stroke-linecap:round;transition:stroke .3s}
.cb{position:absolute;display:grid;place-items:center;filter:drop-shadow(0 0 26px var(--rc))}
.cb.old{animation:pop .8s cubic-bezier(.23,1,.32,1) .1s both}
.cb.new{opacity:0;transform:scale(.3)}
.cele.boom .cb.old{animation:shatter .45s ease-in forwards}
.cele.boom .cb.new{animation:emerge .9s cubic-bezier(.34,1.56,.64,1) .25s forwards}
.cname{position:absolute;bottom:17%;font:800 20px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:#fff;text-shadow:0 0 12px var(--rc)}
.cside{position:absolute;left:5vw;top:18%;z-index:4;text-align:left}
.vic,.tot{font:800 italic 30px var(--fd);text-transform:uppercase;color:#fff;line-height:1;margin-bottom:14px;animation:rise .7s cubic-bezier(.23,1,.32,1) .2s both}
.vic b{display:block;font-size:22px;color:#fde68a;font-style:normal}
.tot b{display:block;font-size:22px;color:var(--rc2);font-style:normal;font-variant-numeric:tabular-nums}
.cele.loss .vic b{color:#fb7185}
.xpg{font:800 18px var(--fd);color:#93c5fd;animation:rise .7s cubic-bezier(.23,1,.32,1) .4s both}
.cbanner{position:relative;z-index:4;margin-top:22px;width:min(88vw,460px);padding:12px 18px;text-align:center;overflow:hidden;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--rc) 70%,#000) 15%,color-mix(in srgb,var(--rc2) 80%,#fff) 50%,color-mix(in srgb,var(--rc) 70%,#000) 85%,transparent);
  clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);transform:scaleX(0);transition:transform .6s cubic-bezier(.23,1,.32,1)}
.cbanner span{font:800 italic 26px var(--fd);letter-spacing:.08em;text-transform:uppercase;color:#1a0f00;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.cbanner::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.85) 50%,transparent 70%);transform:translateX(-120%)}
.cele.done .cbanner,.cele.boom .cbanner{transform:scaleX(1);transition-delay:.5s}
.cele.done .cbanner::after,.cele.boom .cbanner::after{animation:shine 1.4s ease-in-out 1s}
.cele.rankup .cbanner{background:linear-gradient(90deg,transparent,#7a4a05 12%,#fde68a 50%,#7a4a05 88%,transparent)}
.ctap{position:relative;z-index:4;margin-top:16px;font-size:13px;color:rgba(255,255,255,.6)}
@media (max-width:420px){.cside{top:8%;left:6vw}.vic,.tot{font-size:24px}}

@keyframes raypulse{0%{opacity:.4}20%{opacity:1}100%{opacity:.4}}
@keyframes shatter{0%{transform:scale(1);opacity:1;filter:brightness(1) drop-shadow(0 0 26px var(--rc))}60%{transform:scale(1.35);opacity:1;filter:brightness(3) drop-shadow(0 0 40px #fff)}100%{transform:scale(1.8);opacity:0;filter:brightness(4) blur(6px)}}
@keyframes emerge{0%{opacity:0;transform:scale(.3) rotate(-12deg)}100%{opacity:1;transform:scale(1) rotate(0)}}

  var day=plan.day && plan.day.title===L.title ? plan.day : (plan.days.find(function(x){ return x.title===L.title; })||plan.day);
  var scaled = day ? scaleDay(day, rIdx) : null;

function ledger(upto){
  upto = upto || today();
  var p=S.profile, startR=p.rankStart||today();
  var dates=Object.keys(S.train).concat(Object.keys(S.food)).sort();
  var first = dates.length&&dates[0]<startR ? dates[0] : startR;
  var st={ idx:0, rp:0, xp:0, peak:0, shields:0, placements:0, events:[], streak:0, bestStreak:0, sessions:0, prs:0 };
  var hist={}, weekDone=0, weekPlanned=0;
  for(var d=first; d<=upto; d=addDays(d,1)){
    var isPast = d<upto, plan=planFor(d), L=S.train[d], sick=(p.sick||{})[d];
    if(dow(d)===0){ // new week: reward a full week with a shield
      if(weekPlanned>0 && weekDone>=weekPlanned){ st.shields=Math.min(2,st.shields+1); st.events.push({d:d,rp:0,t:"Full week cleared. Shield earned ("+st.shields+"/2)",k:"shield"}); }
      weekDone=0; weekPlanned=0;
    }
    if(plan.day) weekPlanned++;
    if(L && L.ex && Object.keys(L.ex).length){
      var entry = st.placements<RP_RULES.placements ? 0 : RP_RULES.entryBy(st.idx);
      var sc=sessionScore(d, L, plan, hist, st.idx);
      var mult = st.placements<RP_RULES.placements ? RP_RULES.placementMult : 1;
      var gain = (sc.rp>0? sc.rp*mult : sc.rp) - entry;
      if(entry) sc.lines.push(["Ranked entry cost ("+rankOf(st.idx).r.name+")", -entry]);
      if(mult>1) sc.lines.push(["Placement session "+(st.placements+1)+"/"+RP_RULES.placements+": RP doubled", 0]);
      applyRP(st, gain, d, (L.title||"Session"), sc.lines, "session");
      st.xp+=sc.xp; st.sessions++; st.prs+=sc.prs.length; if(plan.day) weekDone++;
      if(st.placements<RP_RULES.placements) st.placements++;

    } else if(plan.day && isPast && d>=startR){

      else if(st.shields>0){ st.shields--; st.events.push({d:d,rp:0,t:"Missed "+plan.day.title+". Shield used",k:"shield"}); st.streak=0; }
      else { var pen=plan.day.cardioDay?-8:RP_RULES.missed; applyRP(st, pen, d, "Missed "+plan.day.title, [["Missed scheduled "+(plan.day.cardioDay?"cardio":"workout"), pen]], "miss"); st.streak=0; }

      else {

        if(Math.abs(x.kcal-t.kcal)<=t.kcal*0.1){ g+=RP_RULES.kcal; lines.push(["Calories within 10%", RP_RULES.kcal]); }
        if(x.fib>=t.fib*0.9){ g+=RP_RULES.fibre; lines.push(["Fibre target hit", RP_RULES.fibre]); }

function applyRP(st, delta, d, title, lines, kind){
  var before=st.idx;

  while(st.idx<21 && st.rp>=TIER_RP){ st.rp-=TIER_RP; st.idx++; }
  if(st.idx>=21){ /* Apex: RP keeps counting up as an Apex score */ }
  while(st.rp<0){
    if(st.idx===0){ st.rp=0; break; }
    if(st.idx%3===0 && st.idx<21 && st.demoGrace!==st.idx){ st.demoGrace=st.idx; st.rp=0; lines=lines.concat([["Demotion protection used. Next drop below 0 demotes you",0]]); break; }

  st.events.push({ d:d, rp:delta, t:title, lines:lines, k:kind, from:before, to:st.idx });
}

}
function e1rm(w,r){ w=num(w); r=num(r); if(w<=0||r<=0||r>12) return 0; return w*(1+r/30); }

  var h={};

    var ex=S.train[d].ex||{};

// rule-based coach checks
function checks(){
  var out=[], t=targets(), d0=today(), logged=[], tp=0, tk=0, low=0;
  for(var i=1;i<=7;i++){ var d=addDays(d0,-i); if((S.food[d]||[]).length){ var x=dayTotals(d); logged.push(x); tp+=x.p; tk+=x.kcal; if(x.p<t.p*0.8) low++; } }
  if(logged.length<4) out.push(["warn","Only "+logged.length+" of the last 7 days have food logged. I cannot coach what I cannot see. Log every meal, even roughly."]);
  else {
    var ap=tp/logged.length, ak=tk/logged.length;
    if(low>=3) out.push(["bad","Protein was under 80% of target on "+low+" days this week (average "+r0(ap)+" g, target "+t.p+" g). Add a protein source to every meal."]);
    else out.push(["ok","Protein averaged "+r0(ap)+" g against a "+t.p+" g target."]);
    var dev=(ak-t.kcal)/t.kcal;
    if(Math.abs(dev)>0.12) out.push(["warn","Calories averaged "+r0(ak)+" against a "+t.kcal+" target ("+(dev>0?"+":"")+r0(dev*100)+"%). Logging misses oils and drinks most often."]);
  }
  var wNow=weightAvg(d0,7), wPrev=weightAvg(addDays(d0,-7),7), wt=num(S.profile.weight)||80;
  if(wNow&&wPrev){
    var pct=(wNow-wPrev)/wPrev*100, g=S.profile.goal;
    var band={bulk:[0.25,0.5],lean:[0.1,0.35],recomp:[-0.15,0.15],cut:[-1,-0.5]}[g]||[-0.2,0.2];
    var msg="7-day average weight changed "+(pct>0?"+":"")+pct.toFixed(2)+"% this week. Target band for your goal: "+band[0]+"% to "+band[1]+"%.";
    out.push([pct<band[0]-0.1||pct>band[1]+0.1?"warn":"ok", msg+(pct<band[0]-0.1?" Add about 150 kcal a day.":pct>band[1]+0.1?" Cut about 150 kcal a day.":"")]);
  } else out.push(["warn","Log your morning weight on the Me tab most days. Decisions use 7-day averages."]);
  var planned=0, done=0;
  for(var j=1;j<=14;j++){ var dd=addDays(d0,-j); if(planFor(dd).day){ planned++; if(S.train[dd]) done++; } }
  out.push([done/Math.max(1,planned)<0.75?"bad":"ok", "Sessions logged: "+done+" of "+planned+" planned in the last 14 days."]);
  var pains=[]; sessionsBetween(addDays(d0,-13),d0).forEach(function(d){ var p=num(S.train[d].pain); if(p>3) pains.push(d); });
  if(pains.length) out.push(["bad","Tendon pain above 3 out of 10 on "+pains.length+" session(s). Drop to an easier variation. If it lasts past the next day, see a physio."]);
  var h=liftHistory(), stalled=[];
  Object.keys(h).forEach(function(n){ var a=h[n]; if(a.length>=4){ var l=a.slice(-4); if(l[3].v<=l[0].v*1.005) stalled.push(n); } });
  if(stalled.length) out.push(["warn","No progress over 4 sessions on: "+stalled.slice(0,3).join(", ")+". Check sleep and food first, then swap the variation or add a set."]);
  return out;
}

    [["Complete a session (80%+ of sets)","+"+RP_RULES.session],["Partial session","+"+RP_RULES.partialMin+" or more"],["Each new personal record","+"+RP_RULES.pr+" (max "+RP_RULES.prCap+")"],["Matched or beat last time, per lift","+"+RP_RULES.improve],["Effort logged in range, per lift","+"+RP_RULES.rirHit],["Cardio session, plus rank target","+"+RP_RULES.cardio+" / +"+RP_RULES.cardioLong],["Protein target hit","+"+RP_RULES.protein],["Calories within 10%","+"+RP_RULES.kcal],["Fibre target","+"+RP_RULES.fibre],["Weigh-in","+"+RP_RULES.weigh],["Lift dropped over 5%",RP_RULES.drop+" per lift"],["Missed gym or tendon session",String(RP_RULES.missed)],["Missed cardio session","-8"],["No food logged for a day",String(RP_RULES.noFood)],["Ranked entry cost per session","0 to -15 by rank"]].map(function(r){ return '<div class="rr"><span>'+esc(r[0])+'</span><b class="'+(String(r[1]).charAt(0)==="-"?"neg":"pos")+'">'+esc(r[1])+'</b></div>'; }).join("")+
    '<p class="note">First '+RP_RULES.placements+' sessions are placements with double RP and no entry cost. Clear every planned session in a week to earn a shield (hold 2). A shield cancels one missed session. At the bottom of a rank you get one demotion protection before dropping. Pain never costs RP: log it honestly. Sick or injured days can be protected from the Train tab.</p></div>';
  h+='<h2>RP history</h2><div class="card">'+feedHtml(st,25)+'</div>';
  h+='<div class="card"><div class="grid3"><div class="stat"><b>'+st.sessions+'</b><span>Sessions</span></div><div class="stat"><b>'+st.prs+'</b><span>PRs</span></div><div class="stat"><b>'+st.bestStreak+'</b><span>Best streak</span></div></div></div>';
  $("#v-ranked").innerHTML=h;
  $("#copyc").onclick=function(){ navigator.clipboard.writeText(code).then(function(){ toast("Code copied"); },function(){ $("#myc").select(); toast("Select and copy the code"); }); };
  $("#addf").onclick=function(){ var f=parseCode($("#frc").value); if(!f){ toast("That code is not valid"); return; } S.friends=(S.friends||[]).filter(function(x){ return x.name!==f.name; }).concat([f]).slice(0,30); saveLocal(); rRanked(); toast(f.name+" added"); };
  document.querySelectorAll("[data-unf]").forEach(function(b){ b.onclick=function(){ S.friends=S.friends.filter(function(x){ return x.name!==b.dataset.unf; }); saveLocal(); rRanked(); }; });
}

// ---------- Session review: what went well, what to fix, what to do next ----------
var EVID={
  vol:{g:"Moderate",s:"Pelland 2026 meta-regression, 67 studies: more weekly sets build more muscle, with diminishing returns. Schoenfeld 2017: about 10+ sets per muscle a week."},
  rir:{g:"Moderate",s:"Robinson 2024, 55 studies: growth was larger as sets ended closer to failure, about 0 to 5 reps in reserve. Strength barely depended on it."},
  prot:{g:"Moderate",s:"Morton 2018, 49 studies, 1,863 people: gains plateaued near 1.6 g of protein per kg a day."},
  sleep:{g:"Low",s:"Review of 17 studies: several nights of short sleep cut force on multi-joint lifts."},
  pain:{g:"Low",s:"Tendon loading trials kept pain at about 3 out of 10 or less."},
  cardio:{g:"Strong",s:"WHO 2020: adults should do 150 to 300 minutes of moderate aerobic activity a week, plus muscle strengthening on 2 or more days."},
  prog:{g:"Practice",s:"Double progression is standard coaching practice, not tested in trials: hit the top of the rep range, then add load."}
};
function sessionReview(d){
  var L=S.train[d]||{}, pl=planUI(d), day=pl.days.find(function(x){ return x.title===L.title; })||pl.day, R={good:[],bad:[],next:[]};
  if(!day) return R;
  function add(k,t,e){ R[k].push({t:t,e:EVID[e]}); }
  var planned=0, done=0, rirs=[], tops=[], hold=[];
  day.ex.forEach(function(e){
    var m=/^(\d+) x/.exec(e.sets), want=e.cardio?1:(m?+m[1]:1), got=((L.ex||{})[e.n]||{}).sets||[];
    var real=got.filter(function(s){ return num(s.r)>0||num(s.t)>0||num(s.min)>0||num(s.w)>0; });
    planned+=want; done+=Math.min(want,real.length);
    real.forEach(function(s){ if(s.rir!==""&&s.rir!=null) rirs.push(num(s.rir)); });
    var rm=/x (\d+)\s*[–-]\s*(\d+)/.exec(e.sets);
    if(rm&&real.length>=want&&real.every(function(s){ return num(s.r)>=+rm[2] && (s.rir===""||s.rir==null||num(s.rir)>=1); })) tops.push(e.n);
  });
  var frac=planned?done/planned:0;
  if(day.cardioDay){
    var mins=0; Object.keys(L.ex||{}).forEach(function(n){ (L.ex[n].sets||[]).forEach(function(s){ mins+=num(s.min); }); });
    var wk=0; for(var i=0;i<7;i++){ var dd=addDays(d,-i), T=S.train[dd]; if(T&&T.ex) Object.keys(T.ex).forEach(function(n){ (T.ex[n].sets||[]).forEach(function(s){ wk+=num(s.min); }); }); }
    if(mins>=(day.diff?day.diff.z2:30)) add("good","You hit your cardio target with "+r0(mins)+" minutes.","cardio"); else add("bad","Only "+r0(mins)+" minutes of cardio. Your rank target is "+(day.diff?day.diff.z2:30)+".","cardio");
    if(wk<150) add("next",r0(wk)+" cardio minutes this week. Aim for at least 150.","cardio"); else add("good",r0(wk)+" cardio minutes this week, inside the health guideline.","cardio");
    return R;
  }
  if(frac>=0.8) add("good","You finished "+Math.round(frac*100)+"% of your planned sets.","vol"); else add("bad","You finished "+Math.round(frac*100)+"% of planned sets. Missing sets means less growth stimulus.","vol");
  if(rirs.length){
    var avg=rirs.reduce(function(a,b){ return a+b; },0)/rirs.length;
    if(avg<=3) add("good","Average effort was "+avg.toFixed(1)+" reps in reserve. That's close enough to failure to grow.","rir");
    else add("bad","Average effort was "+avg.toFixed(1)+" reps in reserve. That's too easy for size. Push to 1 to 3.","rir");
    var zero=rirs.filter(function(r){ return r===0; }).length;
    if(zero>rirs.length*0.6) add("next","Most sets went to failure. On heavy compounds, stopping 2 to 4 short keeps strength gains with less fatigue.","rir");
  } else add("next","Log reps in reserve on each set so I can judge your effort.","rir");
  var h=liftHistory(), prs=[], drops=[];
  Object.keys(L.ex||{}).forEach(function(n){ var a=h[n]; if(!a||a.length<2) return; var last=a[a.length-1], prev=a[a.length-2]; if(last.d!==d) return; if(last.v>prev.v*1.005) prs.push(n); else if(last.v<prev.v*0.95) drops.push(n); });
  if(prs.length) add("good","New best on "+prs.slice(0,3).join(", ")+".","prog");
  if(drops.length) add("bad","Strength dropped over 5% on "+drops.slice(0,2).join(", ")+". Check your sleep and food before blaming the program.","sleep");
  if(tops.length) add("next",(day.tendon?"Make it harder next time (harder variation, slower tempo or a backpack) on ":"Add 2.5 kg next time on ")+tops.slice(0,3).join(", ")+". You hit the top of the rep range.","prog");
  var sm=setsByMuscle(d), seen={};
  day.ex.forEach(function(e){ var m=muscleOf(e.n); if(["chest","back","shoulders","biceps","triceps","quads","hamstrings","glutes"].indexOf(m)<0||seen[m]) return; seen[m]=1; var v=sm[m]||0;
    if(v<10&&!day.tendon) add("next",m.charAt(0).toUpperCase()+m.slice(1)+" is on "+v+" hard sets this week. Aim for 10 to 20.","vol");
    else if(v>20) add("next",m.charAt(0).toUpperCase()+m.slice(1)+" is on "+v+" sets this week. Past 20, returns shrink.","vol"); });
  if(day.tendon){ var p=num(L.pain); if(L.pain===""||L.pain==null) add("next","Log your worst tendon pain, 0 to 10.","pain"); else if(p<=3) add("good","Tendon pain stayed at "+p+" out of 10. That's the safe zone.","pain"); else add("bad","Tendon pain hit "+p+" out of 10. Use an easier variation next time. If it lasts past tomorrow, see a physio.","pain"); }
  var t=targets(), x=dayTotals(d);
  if(x.p>=t.p*0.9) add("good","Protein is on track today ("+r0(x.p)+" of "+t.p+" g).","prot"); else add("next","Protein is "+r0(x.p)+" of "+t.p+" g today. Have a protein meal within a few hours.","prot");
  return R;
}
function reviewHtml(R){
  function sec(k,title,cls){ if(!R[k].length) return ""; return '<div class="rv '+cls+'"><div class="rvh">'+title+'</div>'+R[k].map(function(i){ return '<details class="rvi"><summary>'+esc(i.t)+'</summary><div class="rve"><span class="g '+(i.e.g==="Moderate"||i.e.g==="Strong"?"g1":i.e.g==="Low"?"g2":"g3")+'">'+esc(i.e.g)+'</span> '+esc(i.e.s)+'</div></details>'; }).join("")+'</div>'; }
  return sec("good","What you did well","ok")+sec("bad","What hurt your session","bad")+sec("next","Fix for next time","nx");
}

// ---------- Session result: celebration, then animated level-up bar and review ----------
function showResult(d){
  var keep=S.train[d]; delete S.train[d]; var before=ledger(); S.train[d]=keep; _led=null; var st=LED(), ev=null;
  for(var i=st.events.length-1;i>=0;i--){ if(st.events[i].d===d&&st.events[i].k==="session"){ ev=st.events[i]; break; } }
  if(!ev){ toast("Log at least one set to score the session"); return; }
  var up=ev.to>ev.from, dn=ev.to<ev.from, kind=up?"rankup":ev.rp<0?"loss":"win";
  var fromRP=(before.idx===ev.from)?Math.min(100,before.rp):0;
  FX.celebrate({ fromIdx:ev.from, toIdx:ev.to, fromRP:ev.from>=21?100:fromRP, toRP:ev.to>=21?100:Math.min(100,st.rp), delta:ev.rp, xp:Math.max(0,st.xp-before.xp) }, function(){ openReview(d,ev,st,before); });
}
function openReview(d,ev,st,before){
  var dlg=document.getElementById("resdlg"), b=dlg.querySelector(".rbody");
  var totAfter=totalRP(st), totBefore=totalRP(before), fromPct= ev.to>ev.from?0:Math.max(0,Math.min(100, st.rp-(totAfter-totBefore)));
  var lvA=levelFor(st.xp), lvB=levelFor(before.xp), xpFrom= lvA.lvl>lvB.lvl?0:lvB.into/lvB.need*100;
  var R=sessionReview(d);
  b.innerHTML='<div class="kicker center">Session review</div>'+
    '<div class="lvwrap"><div class="lvrow"><span>'+esc(rankLabel(st.idx))+'</span><b class="'+(ev.rp>=0?"pos":"neg")+'">'+(ev.rp>=0?"+":"")+ev.rp+' RP</b></div><div class="rpbar big"><i id="rvRp" style="width:'+fromPct+'%"></i></div><div class="rprow"><span>'+(st.idx>=21?"Apex score "+st.rp:st.rp+" / 100 RP")+'</span><span>Next: '+esc(rankLabel(Math.min(21,st.idx+1)))+'</span></div>'+
    '<div class="lvrow" style="margin-top:12px"><span>Level '+lvA.lvl+(lvA.lvl>lvB.lvl?' <b class="up">Level up</b>':'')+'</span><b class="xpc">+'+Math.max(0,st.xp-before.xp)+' XP</b></div><div class="xpbar big"><i id="rvXp" style="width:'+xpFrom+'%"></i></div></div>'+
    '<details class="rvi rplines"><summary>RP breakdown</summary>'+(ev.lines||[]).map(function(l){ return '<div class="rr"><span>'+esc(l[0])+'</span><b class="'+(l[1]>0?"pos":l[1]<0?"neg":"")+'">'+(l[1]>0?"+":"")+(l[1]||"")+'</b></div>'; }).join("")+'</details>'+
    reviewHtml(R)+'<p class="note">Tap any line to see the evidence behind it.</p>'+
    '<button class="acc big" id="resok" style="width:100%;margin-top:12px">Done</button>';
  if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open","");
  setTimeout(function(){ var a=$("#rvRp"), x=$("#rvXp"); if(a) a.style.width=(st.idx>=21?100:Math.min(100,st.rp))+"%"; if(x) x.style.width=(lvA.into/lvA.need*100)+"%"; }, 120);
  $("#resok").onclick=function(){ if(dlg.close) dlg.close(); else dlg.removeAttribute("open"); render(); };
}

// ---------- Instant updates ----------
var APP_VERSION="2026.11.21-2058";
var UPD=(function(){
  var reg=null, busy=false;
  function reloadOnce(v){ try{ if(sessionStorage.getItem("t9reload")===v) return; sessionStorage.setItem("t9reload",v); }catch(e){} location.reload(); }
  function check(manual){
    if(busy||location.protocol.indexOf("http")!==0) return Promise.resolve(false); busy=true;
    return fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(j){
      busy=false;
      if(j&&j.v&&j.v!==APP_VERSION){
        toast("New version found. Updating...");
        var go=function(){ reloadOnce(j.v); };
        if(reg){ reg.update().then(function(){ if(reg.waiting) reg.waiting.postMessage("skip"); setTimeout(go,900); }).catch(go); } else setTimeout(go,600);
        return true;
      }
      if(manual) toast("You're on the latest version");
      return false;
    }).catch(function(){ busy=false; if(manual) toast("Can't check for updates offline"); return false; });
  }
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(r){ reg=r; }).catch(function(){});
  }
  document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") check(false); });
  window.addEventListener("focus",function(){ check(false); });
  setTimeout(function(){ check(false); },1500);
  setInterval(function(){ if(document.visibilityState==="visible") check(false); },120000);
  return { check:check };
})();
