<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f3f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Train9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="t9x-icon-180.png">
<link rel="icon" href="t9x-icon-192.png">
<title>Train9</title>
<script>
(function(){var d=document.documentElement;try{var t=localStorage.getItem("t9.theme");if(t==="light"||t==="dark")d.setAttribute("data-theme",t);if(localStorage.getItem("t9.auth")||sessionStorage.getItem("t9.off")==="1")d.classList.add("authed");}catch(e){d.classList.add("authed");}d.classList.add("booting");})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
/* ===== Train9 design system: Liquid Glass, violet accent, aqua for progress ===== */
:root{
  --fb:"Geist",system-ui,-apple-system,sans-serif; --fd:"Geist",system-ui,-apple-system,sans-serif; --fg:"Barlow Condensed","Geist",sans-serif;
  --ease:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.65,0,.35,1);
  --r:16px; --r-sm:12px; --r-btn:14px;
  --bg:#0b0a12; --bg2:#13121d; --ink:#f3f2f8; --ink2:#a8a5bb; --ink3:#77748c;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09); --glass3:rgba(255,255,255,.14); --spec:rgba(255,255,255,.16);
  --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.15);
  --v:#8d7ff7; --v2:#b9b0ff; --vt:rgba(141,127,247,.16); --vt2:rgba(141,127,247,.28);
  --aq:#5ce6d2; --aq2:#7ff0de; --aqt:rgba(92,230,210,.13); --aqt2:rgba(92,230,210,.26);
  --ok:#5ce6d2; --warn:#f2c35b; --bad:#f58a8a; --badt:rgba(245,138,138,.12);
  --on:#ffffff; --acc1:#9b8eff; --acc2:#7564ee;
  --shadow:0 1px 1px rgba(0,0,0,.25),0 14px 34px -16px rgba(0,0,0,.75);
  --field:rgba(255,255,255,.055); --scrim:rgba(6,5,12,.62);
  --glowA:rgba(126,104,255,.30); --glowB:rgba(64,214,196,.16);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){ :root:not([data-theme=dark]){
  --bg:#f4f3f9; --bg2:#eceaf5; --ink:#17151f; --ink2:#5b5870; --ink3:#8a879c;
  --glass:rgba(255,255,255,.58); --glass2:rgba(255,255,255,.74); --glass3:rgba(255,255,255,.9); --spec:rgba(255,255,255,.95);
  --line:rgba(30,24,60,.08); --line2:rgba(30,24,60,.14);
  --v:#6a58e6; --v2:#5543d2; --vt:rgba(106,88,230,.10); --vt2:rgba(106,88,230,.18);
  --aq:#0f9e8c; --aq2:#0b8a7a; --aqt:rgba(15,158,140,.10); --aqt2:rgba(15,158,140,.18);
  --ok:#0f9e8c; --warn:#b7791f; --bad:#d64545; --badt:rgba(214,69,69,.09);
  --acc1:#7a6af0; --acc2:#5a47dc;
  --shadow:0 1px 1px rgba(40,30,90,.05),0 14px 32px -18px rgba(60,40,140,.28);
  --field:rgba(255,255,255,.75); --scrim:rgba(30,24,60,.28);
  --glowA:rgba(122,106,240,.20); --glowB:rgba(15,190,170,.14);
  color-scheme:light;
}}
:root[data-theme=light]{
  --bg:#f4f3f9; --bg2:#eceaf5; --ink:#17151f; --ink2:#5b5870; --ink3:#8a879c;
  --glass:rgba(255,255,255,.58); --glass2:rgba(255,255,255,.74); --glass3:rgba(255,255,255,.9); --spec:rgba(255,255,255,.95);
  --line:rgba(30,24,60,.08); --line2:rgba(30,24,60,.14);
  --v:#6a58e6; --v2:#5543d2; --vt:rgba(106,88,230,.10); --vt2:rgba(106,88,230,.18);
  --aq:#0f9e8c; --aq2:#0b8a7a; --aqt:rgba(15,158,140,.10); --aqt2:rgba(15,158,140,.18);
  --ok:#0f9e8c; --warn:#b7791f; --bad:#d64545; --badt:rgba(214,69,69,.09);
  --acc1:#7a6af0; --acc2:#5a47dc;
  --shadow:0 1px 1px rgba(40,30,90,.05),0 14px 32px -18px rgba(60,40,140,.28);
  --field:rgba(255,255,255,.75); --scrim:rgba(30,24,60,.28);
  --glowA:rgba(122,106,240,.20); --glowB:rgba(15,190,170,.14);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 var(--fb);-webkit-text-size-adjust:100%;background:var(--bg);font-feature-settings:"ss01","cv11"}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 30% at 18% 12%,var(--glowA),transparent 70%),radial-gradient(34% 28% at 88% 78%,var(--glowB),transparent 70%),radial-gradient(30% 24% at 85% 18%,color-mix(in srgb,var(--glowA) 50%,transparent),transparent 70%);
  filter:blur(24px);animation:t9drift 36s ease-in-out infinite alternate}
@keyframes t9drift{0%{transform:translate(0,0)}100%{transform:translate(-3%,2%)}}
.wrap{max-width:720px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;letter-spacing:-.015em;line-height:1.15}
h1{font-size:28px;font-weight:700}
h2{font-size:17px;font-weight:650;margin:26px 4px 10px;color:var(--ink)}
h3{font-size:17px;font-weight:650}
p{margin:6px 0;text-wrap:pretty}
.muted{color:var(--ink2)}.small{font-size:14px}.center{text-align:center}
.hide{display:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
.exh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.exh b{font-weight:600}
.note{font-size:13px;color:var(--ink2);margin-top:8px}
.kicker{font:600 12px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.hello{font-size:15px;color:var(--ink2);margin:4px 4px 12px}

/* glass surfaces */
.card,.hero,details.card,.statusbar{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 var(--spec),var(--shadow)}
.card,details.card{padding:16px;margin:12px 0}
.card::before,.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(170deg,rgba(255,255,255,.06),transparent 40%)}
details.card>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:600;min-height:28px;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);transition:transform .25s var(--ease);margin-right:4px}
details.card[open]>summary::after{transform:rotate(-135deg)}
details summary{cursor:pointer}

/* status bar */
.statusbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 10px;border-radius:20px;margin-bottom:6px}
.avatar{width:40px;height:40px;border-radius:12px;flex:0 0 auto;overflow:hidden;box-shadow:0 0 0 1px var(--line2),0 6px 16px -6px var(--glowA)}
.avatar img{width:100%;height:100%;display:block}
.brand{font:700 18px var(--fd);letter-spacing:-.01em;color:var(--ink)}
#sub{font-size:12.5px;color:var(--ink2);line-height:1.25}
.topr{display:flex;gap:6px;align-items:center}
.gear,.ibtn{min-height:38px;min-width:38px;width:38px;height:38px;padding:0;border-radius:12px;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--line);color:var(--ink)}
.ibtn svg,.gear svg{width:19px;height:19px}
.ibtn[aria-pressed=true]{color:var(--v2);background:var(--vt);border-color:var(--vt2)}
#wkchip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:38px;padding:2px 10px 2px 4px;border-radius:12px;background:var(--glass2);border:1px solid var(--line);font:600 13px var(--fb);color:var(--ink)}
@media (max-width:370px){#wkchip span{display:none}#wkchip{padding:2px 4px}}

/* buttons and fields */
button,.btn{font:600 15px var(--fb);border-radius:var(--r-btn);border:1px solid var(--line);background:var(--glass2);color:var(--ink);padding:10px 14px;min-height:44px;cursor:pointer;
  transition:transform .14s var(--ease),background-color .2s,border-color .2s,box-shadow .2s;-webkit-user-select:none;user-select:none}
button:active,.btn:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-within{outline:2px solid var(--v);outline-offset:2px}
button.acc,.btn.acc{background:linear-gradient(180deg,var(--acc1),var(--acc2));color:#fff;border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 24px -10px var(--v)}
button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.soft{background:var(--glass2);min-height:38px;padding:7px 14px;border-radius:999px;font-size:14px}
button.big{min-height:54px;font:650 17px var(--fb);border-radius:16px;padding:12px 20px}
.wide{width:100%;margin-top:12px}
label{display:block;font:500 13px var(--fb);color:var(--ink2);margin-bottom:5px}
input,select,textarea{width:100%;font:16px var(--fb);color:var(--ink);background:var(--field);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;min-height:44px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:76px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ink3)}
.seg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--glass)}
.seg button{border:0;border-radius:0;min-height:38px;background:transparent}
.seg button[aria-pressed=true]{background:var(--vt2);color:var(--ink)}

/* chips, pills, tags */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 12px var(--fb);background:var(--glass2);color:var(--ink2);border:1px solid var(--line)}
.chip.A{background:var(--vt);color:var(--v2);border-color:var(--vt2)}
.chip.B{background:var(--aqt);color:var(--aq2);border-color:var(--aqt2)}
.chip.C{background:var(--glass2);color:var(--ink);border-color:var(--line2)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill,.coin{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);font:600 13px var(--fb);color:var(--ink);font-variant-numeric:tabular-nums}
.coin i{font-style:normal;font-size:12px;color:var(--v2)}
.coin.xp i{color:var(--aq2)}
.tag{font:600 11px var(--fb);text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--glass2);color:var(--ink2);margin-left:6px}
.tag.cardio{background:var(--aqt);color:var(--aq2)}
.g{font:600 11px var(--fb);padding:2px 7px;border-radius:6px;text-transform:uppercase}
.g.g1{background:var(--aqt2);color:var(--aq2)}.g.g2{background:rgba(242,195,91,.18);color:var(--warn)}.g.g3{background:var(--glass2);color:var(--ink2)}
.rx{font:600 13.5px var(--fb);color:var(--v2);white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}.up{color:var(--v2)}.dn{color:var(--bad)}.plus{color:var(--aq2)}

/* tabs */
nav.tabs{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;display:grid;grid-template-columns:repeat(6,1fr);padding:5px;max-width:700px;margin:0 auto;
  background:color-mix(in srgb,var(--bg) 62%,transparent);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--line2);border-radius:24px;box-shadow:inset 0 1px 0 var(--spec),0 18px 40px -14px rgba(0,0,0,.55)}
nav.tabs button{background:transparent;border:0;border-radius:19px;color:var(--ink2);font:600 11px var(--fb);letter-spacing:0;text-transform:none;padding:7px 0 6px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected=true]{color:var(--ink);background:var(--vt2);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
nav.tabs button[aria-selected=true] svg{color:var(--v2)}
main section:not(.hide){animation:t9in .32s var(--ease)}
@keyframes t9in{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}

/* hero and rank */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px;border-radius:20px;margin:6px 0 12px}
.heroB{position:relative;display:grid;place-items:center}
.heroB::before{content:"";position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(circle,var(--glowA),transparent 68%);z-index:-1}
.heroB .badge{filter:drop-shadow(0 10px 16px rgba(0,0,0,.45))}
.rk{font:700 26px var(--fd);letter-spacing:-.02em;margin:2px 0 10px;font-style:normal;text-transform:none}
.badge{display:block;overflow:visible}
.float{animation:float 5s ease-in-out infinite}
.rpbar,.xpbar{height:10px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);overflow:hidden;box-shadow:none}
.rpbar i,.xpbar i{display:block;height:100%;border-radius:999px;position:relative;transition:width .8s var(--ease)}
.rpbar i{background:linear-gradient(90deg,var(--v),var(--aq));box-shadow:0 0 14px -2px var(--glowA)}
.xpbar i{background:var(--aq)}
.rpbar.big{height:14px}.xpbar.big{height:10px}
.rprow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-top:6px;font-variant-numeric:tabular-nums}
@media (max-width:400px){.hero{grid-template-columns:auto 1fr;gap:12px;padding:16px}.rk{font-size:23px}}
.banner{margin:10px 0;padding:10px 14px;border-radius:14px;background:var(--vt);border:1px solid var(--vt2);font-size:14px}
.mission{border-color:var(--vt2)}

/* home: week, quests, rings */
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.wd{border-radius:12px;padding:8px 0 7px;text-align:center;background:var(--glass);border:1px solid var(--line);font-size:11px;color:var(--ink2);line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.wd b{display:block;font:600 16px var(--fb);color:var(--ink);margin:3px 0 2px}
.wd.done{background:var(--aqt);border-color:var(--aqt2)}.wd.done b{color:var(--aq2)}
.wd.miss{background:var(--badt);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}.wd.miss b{color:var(--bad)}
.wd.today{border-color:var(--v);box-shadow:inset 0 0 0 1px var(--v)}
.quest{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 2px;min-height:50px;margin:0}
.quest:first-of-type{border-top:0}
.qc{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font:700 12px var(--fb);color:var(--bg)}
.quest.done .qc{background:var(--aq);border-color:var(--aq)}
.quest.done .qt{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--ink3)}
.qt{font-size:15px}
.qx{font:600 12.5px var(--fb);color:var(--v2);white-space:nowrap}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.ring{position:relative;aspect-ratio:1;max-width:140px;width:100%;margin:0 auto;border-radius:50%;display:grid;place-content:center;text-align:center;background:none}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--v) calc(var(--v,0)*1%),var(--glass3) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 calc(100% - 9px));mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 calc(100% - 9px))}
.ring.p::before{background:conic-gradient(var(--aq) calc(var(--v,0)*1%),var(--glass3) 0)}
.ring b{position:relative;font:700 22px var(--fb);letter-spacing:-.02em}
.ring span{position:relative;font-size:12px;color:var(--ink2);padding:0 16px;line-height:1.25}

/* lists */
.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);margin:6px 0;font-size:14.5px}
.flag::before{content:"";flex:0 0 8px;height:8px;margin-top:7px;border-radius:50%;background:var(--ink3)}
.flag.bad::before{background:var(--bad)}.flag.warn::before{background:var(--warn)}.flag.ok::before{background:var(--ok)}
.feed{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.feed:last-child{border-bottom:0}
.fd{color:var(--ink2);font-variant-numeric:tabular-nums}
.fr{font:700 15px var(--fb);font-variant-numeric:tabular-nums}
.rr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.rr:last-of-type{border-bottom:0}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:700 22px var(--fb);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2)}
.bar{height:8px;border-radius:999px;background:var(--glass2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--ink3);border-radius:999px}
.bar i.ok{background:var(--aq)}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.band{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink3);border-right:2px solid var(--ink3);opacity:.5}
.macro{display:grid;grid-template-columns:72px 1fr 92px;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.macro .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.spark{width:100%;height:46px;color:var(--v)}
.food{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.food:first-child{border-top:0}
.thumb{max-width:100%;max-height:220px;border-radius:12px;display:block;margin:8px auto}
.ex{border-top:1px solid var(--line);padding:14px 0}
.ex:first-child{border-top:0}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 1fr 36px;gap:6px;align-items:center;margin:4px 0}
.setrow input{min-height:40px;padding:6px 8px;text-align:center}
.setrow .x{min-height:40px;padding:0}
.ev{border-top:1px solid var(--line);padding:10px 0}

/* program styles */
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.style{text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--glass);min-height:84px}
.style b{display:block;font:650 16px var(--fb);letter-spacing:-.01em}
.style span{font-size:13px;color:var(--ink2);line-height:1.35;display:block;margin-top:2px}
.style[aria-pressed=true]{border-color:var(--v);background:var(--vt);box-shadow:inset 0 0 0 1px var(--v)}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 13px;border-radius:16px;max-width:88%;white-space:pre-wrap;font-size:15px}
.msg.u{align-self:flex-end;background:linear-gradient(180deg,var(--acc1),var(--acc2));color:#fff;border-bottom-right-radius:6px}
.msg.c{align-self:flex-start;background:var(--glass2);border:1px solid var(--line);border-bottom-left-radius:6px}

/* dialogs */
dialog{border:1px solid var(--line2);border-radius:22px;padding:0;color:var(--ink);width:min(94vw,520px);max-height:88vh;

.pod span{font:600 12.5px var(--fb);color:var(--ink2);font-variant-numeric:tabular-nums}
.pod.you .pav{outline:2px solid var(--v);outline-offset:2px}

.rung.cur{background:var(--vt);border-color:var(--vt2)}
.rung b{font:650 16px var(--fb)}
.rankmod{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}

/* review sheet colours */

.rv.ok{background:var(--aqt);border-color:var(--aqt2)}.rv.ok .rvh{color:var(--aq2)}
.rv.bad{background:var(--badt);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.rv.nx{background:var(--vt);border-color:var(--vt2)}.rv.nx .rvh{color:var(--v2)}

/* toast */
.t9toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:500;padding:10px 16px;border-radius:14px;max-width:88vw;font:500 14px var(--fb);
  color:var(--ink);background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line2);box-shadow:0 14px 30px -12px rgba(0,0,0,.5);animation:t9in .25s var(--ease)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.fig{width:100%;height:100%;display:block;color:var(--ink)}
.fig line{stroke:currentColor;stroke-width:5;stroke-linecap:round}
.fig .far{opacity:.35}
.fig .hl{stroke:var(--a)}

.fig .bd{stroke:none}

/* review */
.lvwrap{margin:12px 0}
.lvrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-weight:600}
.lvrow b{font:800 22px var(--fd)}
.xpc{color:#93c5fd}
.rv{margin-top:14px;border-radius:20px;padding:12px;border:1px solid var(--line)}
.rv.ok{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.3)}
.rv.bad{background:rgba(251,113,133,.08);border-color:rgba(251,113,133,.3)}
.rv.nx{background:rgba(147,197,253,.08);border-color:rgba(147,197,253,.3)}
.rvh{font:800 17px var(--fd);letter-spacing:.04em;margin-bottom:4px}
.rv.ok .rvh{color:var(--ok)}.rv.bad .rvh{color:var(--bad)}.rv.nx .rvh{color:#93c5fd}

.rvi summary::-webkit-details-marker{display:none}

.rve{font-size:13px;color:var(--ink2);padding:0 0 8px 12px}
.rplines{margin-top:8px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
/* celebration: ranked ring */
.cele{position:fixed;inset:0;z-index:200;display:grid;place-items:center;align-content:center;gap:10px;overflow:hidden;cursor:pointer;--rc:#a855f7;--rc2:#e9d5ff;
  background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--rc) 55%,transparent),rgba(8,8,20,.95) 62%);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  opacity:0;transform:scale(1.05);transition:opacity .45s ease-out,transform .6s cubic-bezier(.23,1,.32,1),background .5s}
.cele.in{opacity:1;transform:none}
.cele.out{opacity:0;transform:translateY(-105%);transition:transform .65s cubic-bezier(.7,0,.84,0),opacity .65s ease-in}
.cele canvas{position:absolute;inset:0;pointer-events:none;z-index:3}
.cele .rays{position:absolute;left:50%;top:44%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;pointer-events:none;opacity:.4;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc2) 60%,transparent) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 58%);mask:radial-gradient(circle,#000 0,transparent 58%);animation:spin 16s linear infinite;transition:opacity .4s}
.cele.loss .rays{opacity:.1}
.cele .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 44%,#fff,color-mix(in srgb,var(--rc2) 70%,transparent) 30%,transparent 60%);opacity:0;pointer-events:none;z-index:2}
.cele.boom .flash{animation:flash .9s ease-out}
.cele.boom .rays{animation:spin 16s linear infinite,raypulse .9s ease-out}
.cring{position:relative;width:min(74vw,300px);aspect-ratio:1;display:grid;place-items:center;z-index:1}
.ringsvg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 14px var(--rc))}
.ringsvg .trk{fill:rgba(10,8,25,.55);stroke:rgba(255,255,255,.12);stroke-width:16}
.ringsvg .arc{fill:none;stroke:var(--rc2);stroke-width:16;stroke-linecap:round;transition:stroke .3s}
.cb{position:absolute;display:grid;place-items:center;filter:drop-shadow(0 0 26px var(--rc))}
.cb.old{animation:pop .8s cubic-bezier(.23,1,.32,1) .1s both}
.cb.new{opacity:0;transform:scale(.3)}
.cele.boom .cb.old{animation:shatter .45s ease-in forwards}
.cele.boom .cb.new{animation:emerge .9s cubic-bezier(.34,1.56,.64,1) .25s forwards}
.cname{position:absolute;bottom:17%;font:800 20px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:#fff;text-shadow:0 0 12px var(--rc)}
.cside{position:absolute;left:5vw;top:18%;z-index:4;text-align:left}
.vic,.tot{font:800 italic 30px var(--fd);text-transform:uppercase;color:#fff;line-height:1;margin-bottom:14px;animation:rise .7s cubic-bezier(.23,1,.32,1) .2s both}
.vic b{display:block;font-size:22px;color:#fde68a;font-style:normal}
.tot b{display:block;font-size:22px;color:var(--rc2);font-style:normal;font-variant-numeric:tabular-nums}
.cele.loss .vic b{color:#fb7185}
.xpg{font:800 18px var(--fd);color:#93c5fd;animation:rise .7s cubic-bezier(.23,1,.32,1) .4s both}
.cbanner{position:relative;z-index:4;margin-top:22px;width:min(88vw,460px);padding:12px 18px;text-align:center;overflow:hidden;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--rc) 70%,#000) 15%,color-mix(in srgb,var(--rc2) 80%,#fff) 50%,color-mix(in srgb,var(--rc) 70%,#000) 85%,transparent);
  clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);transform:scaleX(0);transition:transform .6s cubic-bezier(.23,1,.32,1)}
.cbanner span{font:800 italic 26px var(--fd);letter-spacing:.08em;text-transform:uppercase;color:#1a0f00;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.cbanner::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.85) 50%,transparent 70%);transform:translateX(-120%)}
.cele.done .cbanner,.cele.boom .cbanner{transform:scaleX(1);transition-delay:.5s}
.cele.done .cbanner::after,.cele.boom .cbanner::after{animation:shine 1.4s ease-in-out 1s}
.cele.rankup .cbanner{background:linear-gradient(90deg,transparent,#7a4a05 12%,#fde68a 50%,#7a4a05 88%,transparent)}
.ctap{position:relative;z-index:4;margin-top:16px;font-size:13px;color:rgba(255,255,255,.6)}
@media (max-width:420px){.cside{top:8%;left:6vw}.vic,.tot{font-size:24px}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{0%{transform:translateY(24px);opacity:0}100%{transform:none;opacity:1}}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
@keyframes raypulse{0%{opacity:.4}20%{opacity:1}100%{opacity:.4}}
@keyframes shatter{0%{transform:scale(1);opacity:1;filter:brightness(1) drop-shadow(0 0 26px var(--rc))}60%{transform:scale(1.35);opacity:1;filter:brightness(3) drop-shadow(0 0 40px #fff)}100%{transform:scale(1.8);opacity:0;filter:brightness(4) blur(6px)}}
@keyframes emerge{0%{opacity:0;transform:scale(.3) rotate(-12deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes shine{to{transform:translateX(120%)}}

/* ===== cinematic layer ===== */
.cele .glc{position:absolute;inset:0;z-index:0}

.shock{position:absolute;inset:20%;border-radius:50%;border:3px solid rgba(255,255,255,.9);opacity:0;pointer-events:none;box-shadow:0 0 40px var(--rc2),inset 0 0 30px var(--rc2)}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  { t: "Hamstring curls and Nordics", g: "Low", c: "y", s: "A 2019 meta-analysis of 15 studies and 8,459 athletes found a risk ratio of 0.49 for hamstring injury with Nordic programs. A later reappraisal contested the size of that benefit. The outcome is hamstring injury, mostly muscle, not tendon.", u: "The home version is a towel slider curl. The Nordic needs an anchor for your feet." },
  { t: "Rotator cuff exercise", g: "Low", c: "y", s: "Littlewood 2012 reviewed exercise for rotator cuff tendinopathy and found support for it, with cautions about study quality. It did not identify one best exercise.", u: "External rotation holds and shoulder blade work. Exact choices are extrapolated." },
  { t: "Elbow tendon exercise", g: "Very low", c: "n", s: "Meta-analyses of lateral elbow tendinopathy show small effects, with eccentric work not clearly better than other exercise, and the field is described as early stage.", u: "Self-resisted wrist holds and slow rotation. Wrist flexor work is extrapolated." },

  { t: "Plyometrics stiffen tendons", g: "Moderate", c: "g", s: "Meta-analysis of 32 studies in healthy adults. Tendon stiffness effect size 0.55 across 135 people. Sprint gain did not reach significance.", u: "Basis for the Week B spring session." },
  { t: "Plyometric dose", g: "Low", c: "y", s: "A 56-study analysis found the largest jump gains with over 10 weeks, over 20 sessions and over 50 jumps a session. Handball players over about 67 kg gained less agility than lighter ones.", u: "Why the ramp starts low and rises slowly for a heavier lifter." },
  { t: "Lifting and sprint work together", g: "Moderate", c: "g", s: "Schumann 2021 meta-analysis. No interference for max strength or size. Explosive strength was blunted, mainly when sessions were under 20 minutes apart. Three hours or more apart showed no clash.", u: "Why speed work gets its own day." },
  { t: "Weekly sets for muscle size", g: "Moderate", c: "g", s: "Schoenfeld 2017 (15 studies) found 0.37% more growth per extra weekly set. Pelland 2026 preprint (67 studies) put the minimum effective dose near 4 sets a week with diminishing returns.", u: "Why the optional size top-ups exist. The 10 to 20 sets band is my inference." },

function ledger(upto){
  upto = upto || today();
  var p=S.profile, startR=p.rankStart||today();
  var dates=Object.keys(S.train).concat(Object.keys(S.food)).sort();
  var first = dates.length&&dates[0]<startR ? dates[0] : startR;
  var st={ idx:0, rp:0, xp:0, peak:0, shields:0, placements:0, events:[], streak:0, bestStreak:0, sessions:0, prs:0 };
  var hist={}, weekDone=0, weekPlanned=0;
  for(var d=first; d<=upto; d=addDays(d,1)){
    var isPast = d<upto, plan=planFor(d), L=S.train[d], sick=(p.sick||{})[d];
    if(dow(d)===0){ // new week: reward a full week with a shield
      if(weekPlanned>0 && weekDone>=weekPlanned){ st.shields=Math.min(2,st.shields+1); st.events.push({d:d,rp:0,t:"Full week cleared. Shield earned ("+st.shields+"/2)",k:"shield"}); }
      weekDone=0; weekPlanned=0;
    }
    if(plan.day) weekPlanned++;
    if(L && L.ex && Object.keys(L.ex).length){
      var entry = st.placements<RP_RULES.placements ? 0 : RP_RULES.entryBy(st.idx);
      var sc=sessionScore(d, L, plan, hist, st.idx);
      var mult = st.placements<RP_RULES.placements ? RP_RULES.placementMult : 1;
      var gain = (sc.rp>0? sc.rp*mult : sc.rp) - entry;
      if(entry) sc.lines.push(["Ranked entry cost ("+rankOf(st.idx).r.name+")", -entry]);
      if(mult>1) sc.lines.push(["Placement session "+(st.placements+1)+"/"+RP_RULES.placements+": RP doubled", 0]);
      applyRP(st, gain, d, (L.title||"Session"), sc.lines, "session");
      st.xp+=sc.xp; st.sessions++; st.prs+=sc.prs.length; if(plan.day) weekDone++;
      if(st.placements<RP_RULES.placements) st.placements++;
      st.streak++; st.bestStreak=Math.max(st.bestStreak,st.streak);
    } else if(plan.day && isPast && d>=startR){
      if(sick){ st.events.push({d:d,rp:0,t:"Rest day protected (sick or injured)",k:"protect"}); }
      else if(st.shields>0){ st.shields--; st.events.push({d:d,rp:0,t:"Missed "+plan.day.title+". Shield used",k:"shield"}); st.streak=0; }
      else { var pen=plan.day.cardioDay?-8:RP_RULES.missed; applyRP(st, pen, d, "Missed "+plan.day.title, [["Missed scheduled "+(plan.day.cardioDay?"cardio":"workout"), pen]], "miss"); st.streak=0; }
    }
    // nutrition, scored once the day is over
    if(isPast && d>=startR){
      var items=S.food[d]||[];
      if(!items.length){ applyRP(st, RP_RULES.noFood, d, "No food logged", [["Food not logged", RP_RULES.noFood]], "food"); }
      else {
        var t=targets(), x=dayTotals(d), lines=[], g=0;
        if(x.p>=t.p*0.9){ g+=RP_RULES.protein; lines.push(["Protein target hit", RP_RULES.protein]); }
        if(Math.abs(x.kcal-t.kcal)<=t.kcal*0.1){ g+=RP_RULES.kcal; lines.push(["Calories within 10%", RP_RULES.kcal]); }
        if(x.fib>=t.fib*0.9){ g+=RP_RULES.fibre; lines.push(["Fibre target hit", RP_RULES.fibre]); }
        st.xp+=30+(g?20:0);
        if(g) applyRP(st, g, d, "Nutrition", lines, "food");
      }
      if((p.weights||[]).some(function(w){ return w.d===d; })){ applyRP(st, RP_RULES.weigh, d, "Weigh-in", [["Morning weigh-in", RP_RULES.weigh]], "food"); st.xp+=10; }
    }
  }
  return st;
}
function applyRP(st, delta, d, title, lines, kind){
  var before=st.idx;
  st.rp+=delta;
  while(st.idx<21 && st.rp>=TIER_RP){ st.rp-=TIER_RP; st.idx++; }
  if(st.idx>=21){ /* Apex: RP keeps counting up as an Apex score */ }
  while(st.rp<0){
    if(st.idx===0){ st.rp=0; break; }
    if(st.idx%3===0 && st.idx<21 && st.demoGrace!==st.idx){ st.demoGrace=st.idx; st.rp=0; lines=lines.concat([["Demotion protection used. Next drop below 0 demotes you",0]]); break; }
    st.idx--; st.rp+=TIER_RP;
  }
  if(st.idx>before) st.demoGrace=null;
  st.peak=Math.max(st.peak, st.idx);
  st.events.push({ d:d, rp:delta, t:title, lines:lines, k:kind, from:before, to:st.idx });
}

function checks(){

  if(logged.length<4) out.push(["warn","Only "+logged.length+" of the last 7 days have food logged. I cannot coach what I cannot see. Log every meal, even roughly."]);
  else {
    var ap=tp/logged.length, ak=tk/logged.length;
    if(low>=3) out.push(["bad","Protein was under 80% of target on "+low+" days this week (average "+r0(ap)+" g, target "+t.p+" g). Add a protein source to every meal."]);
    else out.push(["ok","Protein averaged "+r0(ap)+" g against a "+t.p+" g target."]);
    var dev=(ak-t.kcal)/t.kcal;
    if(Math.abs(dev)>0.12) out.push(["warn","Calories averaged "+r0(ak)+" against a "+t.kcal+" target ("+(dev>0?"+":"")+r0(dev*100)+"%). Logging misses oils and drinks most often."]);
  }
  var wNow=weightAvg(d0,7), wPrev=weightAvg(addDays(d0,-7),7), wt=num(S.profile.weight)||80;
  if(wNow&&wPrev){
    var pct=(wNow-wPrev)/wPrev*100, g=S.profile.goal;
    var band={bulk:[0.25,0.5],lean:[0.1,0.35],recomp:[-0.15,0.15],cut:[-1,-0.5]}[g]||[-0.2,0.2];
    var msg="7-day average weight changed "+(pct>0?"+":"")+pct.toFixed(2)+"% this week. Target band for your goal: "+band[0]+"% to "+band[1]+"%.";
    out.push([pct<band[0]-0.1||pct>band[1]+0.1?"warn":"ok", msg+(pct<band[0]-0.1?" Add about 150 kcal a day.":pct>band[1]+0.1?" Cut about 150 kcal a day.":"")]);
  } else out.push(["warn","Log your morning weight on the Me tab most days. Decisions use 7-day averages."]);
  var planned=0, done=0;
  for(var j=1;j<=14;j++){ var dd=addDays(d0,-j); if(planFor(dd).day){ planned++; if(S.train[dd]) done++; } }
  out.push([done/Math.max(1,planned)<0.75?"bad":"ok", "Sessions logged: "+done+" of "+planned+" planned in the last 14 days."]);

  if(pains.length) out.push(["bad","Tendon pain above 3 out of 10 on "+pains.length+" session(s). Drop to an easier variation. If it lasts past the next day, see a physio."]);

}

async function AI(input, opts){
  opts=opts||{}; var key=getKey(); if(!key) throw {code:"no_key"};
  var turns = typeof input==="string" ? [{role:"user",content:input}] : input.slice();
  var msgs=[]; turns.forEach(function(t){ var last=msgs[msgs.length-1]; if(last&&last.role===t.role) last.content+="\n\n"+t.content; else msgs.push({role:t.role,content:t.content}); });
  if(opts.images&&opts.images.length){
    var blocks=[]; for(var i=0;i<opts.images.length;i++){ blocks.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:await toJpegB64(opts.images[i])}}); }
    var lu=msgs[msgs.length-1]; lu.content=blocks.concat([{type:"text",text:lu.content}]);
  }
  var res;
  try{
    res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:getModel(),max_tokens:opts.max||1200,messages:msgs})});
  } catch(e){ throw {code:"offline"}; }
  if(!res.ok){ var code=res.status===401||res.status===403?"bad_key":res.status===429?"rate_limited":res.status===404?"bad_model":"upstream_error"; var msg=""; try{ msg=(await res.json()).error.message; }catch(e){} throw {code:code,message:msg}; }
  var j=await res.json(), text=(j.content||[]).filter(function(b){ return b.type==="text"; }).map(function(b){ return b.text; }).join("");
  if(opts.onText) opts.onText({text:text,delta:text});
  return {text:text};
}
AI.json=async function(input,opts){
  var r=await AI(input,opts), t=r.text.trim(), m=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(m) t=m[1];
  try{ return JSON.parse(t); }catch(e){}
  var a=t.indexOf("{"), b=t.lastIndexOf("}"); if(a>=0&&b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} }
  throw {code:"invalid_json"};
};

// ---------- Session review: what went well, what to fix, what to do next ----------
var EVID={
  vol:{g:"Moderate",s:"Pelland 2026 meta-regression, 67 studies: more weekly sets build more muscle, with diminishing returns. Schoenfeld 2017: about 10+ sets per muscle a week."},
  rir:{g:"Moderate",s:"Robinson 2024, 55 studies: growth was larger as sets ended closer to failure, about 0 to 5 reps in reserve. Strength barely depended on it."},
  prot:{g:"Moderate",s:"Morton 2018, 49 studies, 1,863 people: gains plateaued near 1.6 g of protein per kg a day."},
  sleep:{g:"Low",s:"Review of 17 studies: several nights of short sleep cut force on multi-joint lifts."},
  pain:{g:"Low",s:"Tendon loading trials kept pain at about 3 out of 10 or less."},
  cardio:{g:"Strong",s:"WHO 2020: adults should do 150 to 300 minutes of moderate aerobic activity a week, plus muscle strengthening on 2 or more days."},
  prog:{g:"Practice",s:"Double progression is standard coaching practice, not tested in trials: hit the top of the rep range, then add load."}
};
function sessionReview(d){
  var L=S.train[d]||{}, pl=planUI(d), day=pl.days.find(function(x){ return x.title===L.title; })||pl.day, R={good:[],bad:[],next:[]};
  if(!day) return R;
  function add(k,t,e){ R[k].push({t:t,e:EVID[e]}); }
  var planned=0, done=0, rirs=[], tops=[], hold=[];
  day.ex.forEach(function(e){
    var m=/^(\d+) x/.exec(e.sets), want=e.cardio?1:(m?+m[1]:1), got=((L.ex||{})[e.n]||{}).sets||[];
    var real=got.filter(function(s){ return num(s.r)>0||num(s.t)>0||num(s.min)>0||num(s.w)>0; });
    planned+=want; done+=Math.min(want,real.length);
    real.forEach(function(s){ if(s.rir!==""&&s.rir!=null) rirs.push(num(s.rir)); });
    var rm=/x (\d+)\s*[–-]\s*(\d+)/.exec(e.sets);
    if(rm&&real.length>=want&&real.every(function(s){ return num(s.r)>=+rm[2] && (s.rir===""||s.rir==null||num(s.rir)>=1); })) tops.push(e.n);
  });
  var frac=planned?done/planned:0;
  if(day.cardioDay){
    var mins=0; Object.keys(L.ex||{}).forEach(function(n){ (L.ex[n].sets||[]).forEach(function(s){ mins+=num(s.min); }); });
    var wk=0; for(var i=0;i<7;i++){ var dd=addDays(d,-i), T=S.train[dd]; if(T&&T.ex) Object.keys(T.ex).forEach(function(n){ (T.ex[n].sets||[]).forEach(function(s){ wk+=num(s.min); }); }); }
    if(mins>=(day.diff?day.diff.z2:30)) add("good","You hit your cardio target with "+r0(mins)+" minutes.","cardio"); else add("bad","Only "+r0(mins)+" minutes of cardio. Your rank target is "+(day.diff?day.diff.z2:30)+".","cardio");
    if(wk<150) add("next",r0(wk)+" cardio minutes this week. Aim for at least 150.","cardio"); else add("good",r0(wk)+" cardio minutes this week, inside the health guideline.","cardio");
    return R;
  }
  if(frac>=0.8) add("good","You finished "+Math.round(frac*100)+"% of your planned sets.","vol"); else add("bad","You finished "+Math.round(frac*100)+"% of planned sets. Missing sets means less growth stimulus.","vol");
  if(rirs.length){
    var avg=rirs.reduce(function(a,b){ return a+b; },0)/rirs.length;
    if(avg<=3) add("good","Average effort was "+avg.toFixed(1)+" reps in reserve. That's close enough to failure to grow.","rir");
    else add("bad","Average effort was "+avg.toFixed(1)+" reps in reserve. That's too easy for size. Push to 1 to 3.","rir");
    var zero=rirs.filter(function(r){ return r===0; }).length;
    if(zero>rirs.length*0.6) add("next","Most sets went to failure. On heavy compounds, stopping 2 to 4 short keeps strength gains with less fatigue.","rir");
  } else add("next","Log reps in reserve on each set so I can judge your effort.","rir");
  var h=liftHistory(), prs=[], drops=[];
  Object.keys(L.ex||{}).forEach(function(n){ var a=h[n]; if(!a||a.length<2) return; var last=a[a.length-1], prev=a[a.length-2]; if(last.d!==d) return; if(last.v>prev.v*1.005) prs.push(n); else if(last.v<prev.v*0.95) drops.push(n); });
  if(prs.length) add("good","New best on "+prs.slice(0,3).join(", ")+".","prog");
  if(drops.length) add("bad","Strength dropped over 5% on "+drops.slice(0,2).join(", ")+". Check your sleep and food before blaming the program.","sleep");
  if(tops.length) add("next",(day.tendon?"Make it harder next time (harder variation, slower tempo or a backpack) on ":"Add 2.5 kg next time on ")+tops.slice(0,3).join(", ")+". You hit the top of the rep range.","prog");
  var sm=setsByMuscle(d), seen={};
  day.ex.forEach(function(e){ var m=muscleOf(e.n); if(["chest","back","shoulders","biceps","triceps","quads","hamstrings","glutes"].indexOf(m)<0||seen[m]) return; seen[m]=1; var v=sm[m]||0;
    if(v<10&&!day.tendon) add("next",m.charAt(0).toUpperCase()+m.slice(1)+" is on "+v+" hard sets this week. Aim for 10 to 20.","vol");
    else if(v>20) add("next",m.charAt(0).toUpperCase()+m.slice(1)+" is on "+v+" sets this week. Past 20, returns shrink.","vol"); });
  if(day.tendon){ var p=num(L.pain); if(L.pain===""||L.pain==null) add("next","Log your worst tendon pain, 0 to 10.","pain"); else if(p<=3) add("good","Tendon pain stayed at "+p+" out of 10. That's the safe zone.","pain"); else add("bad","Tendon pain hit "+p+" out of 10. Use an easier variation next time. If it lasts past tomorrow, see a physio.","pain"); }
  var t=targets(), x=dayTotals(d);
  if(x.p>=t.p*0.9) add("good","Protein is on track today ("+r0(x.p)+" of "+t.p+" g).","prot"); else add("next","Protein is "+r0(x.p)+" of "+t.p+" g today. Have a protein meal within a few hours.","prot");
  return R;
}
function reviewHtml(R){
  function sec(k,title,cls){ if(!R[k].length) return ""; return '<div class="rv '+cls+'"><div class="rvh">'+title+'</div>'+R[k].map(function(i){ return '<details class="rvi"><summary>'+esc(i.t)+'</summary><div class="rve"><span class="g '+(i.e.g==="Moderate"||i.e.g==="Strong"?"g1":i.e.g==="Low"?"g2":"g3")+'">'+esc(i.e.g)+'</span> '+esc(i.e.s)+'</div></details>'; }).join("")+'</div>'; }
  return sec("good","What you did well","ok")+sec("bad","What hurt your session","bad")+sec("next","Fix for next time","nx");
}

function slider(root,onDone){
  var knob=root.querySelector(".knob"), fill=root.querySelector(".sfill"), max=0, x=0, drag=false, sx=0, fired=false;
  function setX(v,anim){ x=Math.max(0,Math.min(max,v)); var tr=anim?"transform .35s var(--ease)":"none"; knob.style.transition=tr; fill.style.transition=anim?"width .35s var(--ease)":"none"; knob.style.transform="translateX("+x+"px)"; fill.style.width=(x+62)+"px"; }
  function done(){ if(fired) return; fired=true; max=root.clientWidth-62; setX(max,true); setTimeout(onDone,240); }
  knob.addEventListener("pointerdown",function(e){ max=root.clientWidth-62; drag=true; sx=e.clientX-x; try{ knob.setPointerCapture(e.pointerId); }catch(er){} });
  knob.addEventListener("pointermove",function(e){ if(drag) setX(e.clientX-sx); });
  function up(){ if(!drag) return; drag=false; if(x>max*0.8) done(); else setX(0,true); }
  knob.addEventListener("pointerup",up); knob.addEventListener("pointercancel",up);
  knob.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "||e.key==="ArrowRight"){ e.preventDefault(); done(); } });
}

// ---------- Instant updates ----------
var APP_VERSION="2026.11.22-0053";
var UPD=(function(){
  var reg=null, busy=false;
  function reloadOnce(v){ try{ if(sessionStorage.getItem("t9reload")===v) return; sessionStorage.setItem("t9reload",v); }catch(e){} location.reload(); }
  function check(manual){
    if(busy||location.protocol.indexOf("http")!==0) return Promise.resolve(false); busy=true;
    return fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(j){
      busy=false;
      if(j&&j.v&&j.v!==APP_VERSION){
        toast("New version found. Updating...");

        if(reg){ reg.update().then(function(){ if(reg.waiting) reg.waiting.postMessage("skip"); setTimeout(go,900); }).catch(go); } else setTimeout(go,600);
        return true;
      }
      if(manual) toast("You're on the latest version");
      return false;
    }).catch(function(){ busy=false; if(manual) toast("Can't check for updates offline"); return false; });
  }
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(r){ reg=r; }).catch(function(){});
  }
  document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") check(false); });
  window.addEventListener("focus",function(){ check(false); });
  setTimeout(function(){ check(false); },1500);
  setInterval(function(){ if(document.visibilityState==="visible") check(false); },120000);
  return { check:check };
})();
